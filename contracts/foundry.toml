[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "prague"
optimizer = true
optimizer_runs = 200

# RPC URLs come from .env (contracts/.env is a symlink to the root .env)
[rpc_endpoints]
anvil = "${RPC_URL_ANVIL}"
sepolia = "${RPC_URL_SEPOLIA}"

# Used by --verify
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false