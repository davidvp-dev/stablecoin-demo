spring.application.name=chain-service

# REST API: GET /chain/health and /chain/supply (see api-definition.yml).
# core-api runs on 8080 and Kafka UI on 8090.
server.port=8081
server.servlet.context-path=/chain
spring.config.import=optional:file:../.env[.properties]

# Spring Configuration for PostgreSQL (own database: chain-service never reads core_db)
spring.datasource.url=jdbc:postgresql://localhost:5433/chain_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka (topics and event contract in docs/events.md)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Same producer guarantees as core-api: ack from every in-sync replica, no
# duplicates from the producer's own retries, and fail fast when Kafka is down.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Consumer (own consumer group: sharing core-api's group would split messages between services)
spring.kafka.consumer.group-id=chain-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Chain and EURDemo contract (Web3jConfig). Values for Anvil; for Sepolia, point
# them to the *_SEPOLIA variables and set chainId=11155111.
app.chain.rpcUrl=${RPC_URL_ANVIL}
app.chain.chainId=31337
app.chain.contractAddress=${EURD_CONTRACT_ADDRESS_ANVIL}
# Must belong to the account with MINTER_ROLE (MINTER_ADDRESS_ANVIL); reported by GET /chain/health
app.chain.minterPrivateKey=${MINTER_PRIVATE_KEY_ANVIL}
# Blocks a contract event must be buried under before it is published: 1 on Anvil, 2-3 on Sepolia
app.chain.confirmations=1
# EIP-1559 caps: 50 gwei max fee, 1 gwei tip. mint() uses about 100k gas.
app.chain.gas.maxFeePerGasWei=50000000000
app.chain.gas.maxPriorityFeePerGasWei=1000000000
app.chain.gas.gasLimit=300000

# Kafka topics: declared here too (KafkaConfig) so chain-service doesn't depend
# on core-api having started first. Same partitions as core-api's.
app.kafka.topicPartitions=3
app.kafka.topicReplicas=1
# Longer than delivery.timeout.ms, so a failure we see means "not delivered"
app.kafka.sendTimeout=15s
# Wait before redelivering a MintApproved whose processing hit an infrastructure
# error (node or database down). It is retried until it works, never skipped.
app.kafka.listenerRetryBackoff=5s

# Mint sender (MintApproved consumer)
# Attempts when the node rejects the transaction or mint() would revert
# (paused, blacklisted recipient...). After the last one, MintFailed is published.
app.mint.maxAttempts=3
app.mint.retryWait=2s

# Contract event reader (ChainEventsReaderJob)
app.reader.interval=2s
# First block to read when there is no checkpoint yet: 0 on Anvil, the
# deployment block on Sepolia (docs/deployments.md)
app.reader.startBlock=0
# Most blocks per eth_getLogs call (public RPCs limit the range)
app.reader.maxBlockRange=500
