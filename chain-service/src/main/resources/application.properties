spring.application.name=chain-service
spring.config.import=optional:file:../.env[.properties]

# Spring Configuration for PostgreSQL (own database: chain-service never reads core_db)
spring.datasource.url=jdbc:postgresql://localhost:5433/chain_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka (topics and event contract in docs/events.md)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer (own consumer group: sharing core-api's group would split messages between services)
spring.kafka.consumer.group-id=chain-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
