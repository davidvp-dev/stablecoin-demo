# Sepolia profile: SPRING_PROFILES_ACTIVE=sepolia (or -Dspring-boot.run.profiles=sepolia).
# Only what differs from application.properties (Anvil) is here.

# Own database per network: sent_transactions, observed_events and checkpoints
# of Anvil and Sepolia never mix (created by infra/postgres/init/01-databases.sql)
spring.datasource.url=jdbc:postgresql://localhost:5433/chain_db_sepolia

app.chain.rpcUrl=${RPC_URL_SEPOLIA}
app.chain.chainId=11155111
app.chain.contractAddress=${EURD_CONTRACT_ADDRESS_SEPOLIA}
# Must belong to MINTER_ADDRESS_SEPOLIA, and that account needs Sepolia ETH for gas
app.chain.minterPrivateKey=${MINTER_PRIVATE_KEY_SEPOLIA}
# A real network can reorganize its last blocks: wait for 3 (~36 s)
app.chain.confirmations=3
# EIP-1559 caps. Sepolia's base fee is usually a few gwei but can spike; if the
# node rejects mints with "max fee per gas less than block base fee", raise the cap.
app.chain.gas.maxFeePerGasWei=50000000000
app.chain.gas.maxPriorityFeePerGasWei=1000000000
app.chain.gas.gasLimit=300000

# Public RPC: fewer calls. A Sepolia block is ~12 s.
app.mint.retryWait=5s
app.reader.interval=12s
# Block of the deployment transaction (docs/deployments.md). No default on
# purpose: reading Sepolia from block 0 would take thousands of eth_getLogs calls.
app.reader.startBlock=${EURD_DEPLOY_BLOCK_SEPOLIA}
app.reader.maxBlockRange=500
