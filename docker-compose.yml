# Nombre del "proyecto": así aparecerá el grupo en Docker Desktop
name: stablecoin-demo

services:

  # ─────────────────────────────────────────────
  # PostgreSQL: base de datos de core-api y chain-service
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine          # qué programa descargar (imagen oficial, versión fija)
    container_name: sd-postgres        # nombre del contenedor en Docker Desktop
    restart: unless-stopped            # si Docker se reinicia, vuelve a levantarlo
    environment:                       # configuración que la imagen lee al arrancar
      POSTGRES_USER: ${POSTGRES_USER}          # valores leídos del fichero .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"                    # tu Mac:5433  →  contenedor:5432
    volumes:
      - pgdata:/var/lib/postgresql/data                       # datos persistentes
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro  # SQL que se ejecuta la 1ª vez
    healthcheck:                       # cómo sabe Docker que Postgres está "sano"
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

# Discos persistentes gestionados por Docker
volumes:
  pgdata:
