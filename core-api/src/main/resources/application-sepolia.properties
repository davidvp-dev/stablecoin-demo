# Sepolia profile: SPRING_PROFILES_ACTIVE=sepolia (or -Dspring-boot.run.profiles=sepolia).
# Only what differs from application.properties (Anvil) is here.

# Own database per network: Sepolia orders, wallets and ledger never mix with
# Anvil's (created by infra/postgres/init/01-databases.sql)
spring.datasource.url=jdbc:postgresql://localhost:5433/core_db_sepolia

# Chain ID in the SIWE message the wallet signs (EIP-191)
app.chainId=11155111
