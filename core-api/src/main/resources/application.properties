# All REST endpoints are served under /api (see api-definition.yml)
server.servlet.context-path=/api

spring.application.name=core-api
spring.config.import=optional:file:../.env[.properties]

# Spring Configuration for PostgreSQL and Kafka
spring.datasource.url=jdbc:postgresql://localhost:5433/core_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Wait for every in-sync replica, and let the producer drop its own retries' duplicates
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast when Kafka is down, so the outbox publisher retries on its next run
# instead of blocking for the 60 s / 2 min defaults. delivery.timeout.ms must be
# at least request.timeout.ms + linger.ms.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Consumer
spring.kafka.consumer.group-id=core-api
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# App Properties for Stablecoin Demo
# Wallet signature verification and challenge generation
app.name=Stablecoin Demo (EURD)
app.domain=localhost:5173
app.URI=http://localhost:5173/
app.chainId=31337
app.challengeExpirationSeconds=300

# CORS: origins allowed to call the API from the browser (comma-separated)
app.cors.allowedOrigins=http://localhost:5173

# Mint orders
# Issuer's bank account: the same for every mint order, the client sends the euros here
app.issuerIban=ES9121000418450200051332
app.sepaReferencePrefix=EURD-

# Kafka topics (created at startup by KafkaTopicsConfig, see docs/events.md)
app.kafka.topicPartitions=3
app.kafka.topicReplicas=1
# How long the outbox publisher waits for the broker's ack of one message.
# Keep it above delivery.timeout.ms (10 s): the producer then always settles the
# message first, so a failure we see means it was not delivered. With a shorter
# wait the producer can still deliver it after we give up, and the retry sends
# it a second time.
app.kafka.sendTimeout=15s

# Outbox publisher job: sends pending outbox_events rows to Kafka
app.outbox.publishInterval=1s
app.outbox.batchSize=100

# Expiry job: CREATED mint orders past expires_at become EXPIRED
app.expiry.interval=1m
app.expiry.initialDelay=10s
app.expiry.batchSize=500

logging.level.org.springframework.web=DEBUG