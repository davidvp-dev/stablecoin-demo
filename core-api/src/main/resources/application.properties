# All REST endpoints are served under /api (see api-definition.yml)
server.servlet.context-path=/api

spring.application.name=core-api
spring.config.import=optional:file:../.env[.properties]

# Spring Configuration for PostgreSQL and Kafka
spring.datasource.url=jdbc:postgresql://localhost:5433/core_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer
spring.kafka.consumer.group-id=core-api
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# App Properties for Stablecoin Demo
# Wallet signature verification and challenge generation
app.name=Stablecoin Demo (EURD)
app.domain=localhost:5173
app.URI=http://localhost:5173/
app.chainId=31337
app.challengeExpirationSeconds=300

# CORS: origins allowed to call the API from the browser (comma-separated)
app.cors.allowedOrigins=http://localhost:5173

# Mint orders
# Issuer's bank account: the same for every mint order, the client sends the euros here
app.issuerIban=ES9121000418450200051332
app.sepaReferencePrefix=EURD-

logging.level.org.springframework.web=DEBUG